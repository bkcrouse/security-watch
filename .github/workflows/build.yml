name: Build and deploy

on:
  schedule:
    - cron: "*/15 * * * *"   # GitHub runs schedules best-effort; expect some drift
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    # Newest data wins: a new push/schedule cancels a build still in flight.
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # NVD lookups, EPSS and download counts are cached between runs so the
      # 15-minute schedule stays fast and polite to upstream APIs.
      - uses: actions/cache/restore@v4
        with:
          path: .cache
          key: feeds-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: feeds-

      - name: Offline smoke test
        env:
          SW_NOW: "2026-10-23T23:00:00Z"
        run: python scripts/build.py --fixtures tests/fixtures --out /tmp/smoke

      - name: Build from live feeds
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python scripts/build.py --out site

      # Save lookups even if the build failed or was cancelled, so the next
      # run resumes instead of starting cold.
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache
          key: feeds-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Never cancel a Pages deploy mid-flight; queue the next one instead.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
